version: "3"

vars:
  BINARY: bin/claude-notify
  CMD: ./cmd/claude-notify

tasks:
  build:
    desc: Compile the claude-notify binary
    cmds:
      - go build -o {{.BINARY}} {{.CMD}}

  dev:
    desc: Build and install binary to bin/
    cmds:
      - task: build
    generates:
      - "{{.BINARY}}"

  run:
    desc: Build and run the claude-notify binary
    silent: true
    aliases: [r]
    cmds:
      - go build -o {{.BINARY}} {{.CMD}}
      - clear
      - ./{{.BINARY}} 2>/tmp/cn-crash.log; cat /tmp/cn-crash.log >&2

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  lint:
    desc: Run go vet
    cmds:
      - go vet ./...

  link:
    desc: Symlink repo into ~/.tmux/plugins/tmux-claude-notify for local development
    vars:
      PLUGIN_DIR: "{{.HOME}}/.tmux/plugins/tmux-claude-notify"
    cmds:
      - mkdir -p "{{.HOME}}/.tmux/plugins"
      - |
        if [ -e "{{.PLUGIN_DIR}}" ]; then
          rm -rf "{{.PLUGIN_DIR}}"
        fi
        ln -s "$(pwd)" "{{.PLUGIN_DIR}}"
        echo "linked: {{.PLUGIN_DIR}} -> $(pwd)"

  unlink:
    desc: Remove dev symlink so TPM installs the native plugin copy
    vars:
      PLUGIN_DIR: "{{.HOME}}/.tmux/plugins/tmux-claude-notify"
    cmds:
      - |
        if [ -L "{{.PLUGIN_DIR}}" ]; then
          rm "{{.PLUGIN_DIR}}"
          echo "unlinked: {{.PLUGIN_DIR}}"
        else
          echo "not a symlink, skipping: {{.PLUGIN_DIR}}"
        fi
      - |
        TPM_INSTALL="{{.HOME}}/.tmux/plugins/tpm/bin/install_plugins"
        if [ -x "$TPM_INSTALL" ]; then
          "$TPM_INSTALL"
        else
          echo "TPM not found at $TPM_INSTALL, skipping plugin install"
        fi

  setup:
    desc: Verify development dependencies and link plugin directory
    cmds:
      - cmd: which go
        silent: false
      - cmd: which tmux
        silent: false
      - cmd: go version
      - cmd: tmux -V
      - task: link
